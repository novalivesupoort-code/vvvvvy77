name: 1080p@50FPS Live Stream

on:
  workflow_dispatch:

concurrency:
  group: live-stream
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pip
          pip install --quiet streamlink
          ffmpeg -version | head -1
          streamlink --version

      - name: Verify Logo
        run: |
          if [ ! -f "ggggagagaggagdyveye.png" ]; then
            echo "❌ Logo not found: ggggagagaggagdyveye.png"
            ls -la
            exit 1
          fi
          echo "✅ Logo found: $(ls -lh ggggagagaggagdyveye.png)"

      - name: Test Source URL
        env:
          SOURCE_URL: "https://blanchedalmond-dugong-106131.hostingersite.com/live.php/play.ts?file=http://kdmax.myddns.me:8080/live/4653175235828573/4653175235828573/221289.m3u8"
        run: |
          echo "🔍 اختبار المصدر..."
          curl -s -o /dev/null -w "HTTP: %{http_code}\n" \
            -A "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36" \
            --max-time 15 \
            "$SOURCE_URL"

      - name: Start Stream
        env:
          SOURCE_URL: "https://blanchedalmond-dugong-106131.hostingersite.com/live.php/play.ts?file=http://kdmax.myddns.me:8080/live/4653175235828573/4653175235828573/221289.m3u8"
          RTMP_URL: "rtmp://vsu.okcdn.ru/input/12590548983404_11747794029164_rjxxwplwjm"
        run: |
          set -uo pipefail

          FAIL_COUNT=0
          MAX_FAILS=9999

          while [ $FAIL_COUNT -lt $MAX_FAILS ]; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "▶ Attempt: $((FAIL_COUNT + 1)) | $(date)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            streamlink \
              --loglevel warning \
              --retry-streams 5 \
              --retry-open 5 \
              --stream-segment-attempts 5 \
              --stream-segment-timeout 10 \
              --http-header "User-Agent=Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36" \
              --http-header "Referer=https://blanchedalmond-dugong-106131.hostingersite.com/" \
              "hlsvariant://$SOURCE_URL" best \
              -O 2>>streamlink.log | ffmpeg \
              -nostdin \
              -hide_banner \
              -loglevel warning \
              -stats \
              -thread_queue_size 2048 \
              -f mpegts -i pipe:0 \
              -loop 1 -framerate 50 -i "ggggagagaggagdyveye.png" \
              -filter_complex \
                "[1:v]scale=1920:1080:flags=lanczos[logo]; \
                 [0:v]scale=1920:1080:force_original_aspect_ratio=decrease:flags=lanczos, \
                     pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black, \
                     setsar=1,fps=50, \
                     unsharp=5:5:0.8:3:3:0.4, \
                     eq=contrast=1.05:saturation=1.1, \
                     format=yuv420p[base]; \
                 [base][logo]overlay=0:0:format=auto[v]" \
              -map "[v]" \
              -map 0:a? \
              -c:v libx264 \
              -preset superfast \
              -tune film \
              -profile:v high \
              -level 4.2 \
              -b:v 8000k \
              -maxrate 8000k \
              -bufsize 16000k \
              -g 100 \
              -keyint_min 50 \
              -sc_threshold 0 \
              -r 50 \
              -c:a aac \
              -b:a 160k \
              -ar 48000 \
              -ac 2 \
              -max_muxing_queue_size 4096 \
              -flvflags no_duration_filesize \
              -f flv \
              "$RTMP_URL" 2>>ffmpeg.log

            EXIT_CODE=$?
            echo "⚠ Pipeline exited with code: $EXIT_CODE"
            echo "--- Last 15 lines of FFmpeg ---"
            tail -15 ffmpeg.log 2>/dev/null || true
            echo "--- Last 15 lines of Streamlink ---"
            tail -15 streamlink.log 2>/dev/null || true

            FAIL_COUNT=$((FAIL_COUNT + 1))
            WAIT=$((FAIL_COUNT * 3))
            [ $WAIT -gt 30 ] && WAIT=30
            echo "🔄 Reconnect in ${WAIT}s... (Fail $FAIL_COUNT/$MAX_FAILS)"
            sleep $WAIT
          done

          echo "❌ Max fails reached"
          exit 1

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-logs
          path: |
            streamlink.log
            ffmpeg.log
          retention-days: 3
          if-no-files-found: ignore
