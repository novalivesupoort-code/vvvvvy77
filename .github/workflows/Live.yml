name: mystream-ayham

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Tools (Fast)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pip
          pip install --quiet streamlink
          ffmpeg -version | head -1
          streamlink --version

      - name: Start Stream
        run: |
          RTMP_URL="rtmp://vsu.okcdn.ru/input/15980421979756_17750707931756_3zvyihuvcy"
          SOURCE_URL="http://www.manar2.shop/x1/59_0.m3u8"

          if [ ! -f "logocopyayhamA.png" ]; then
            echo "❌ Logo file not found!"
            exit 1
          fi

          FAIL_COUNT=0
          MAX_FAILS=10

          while [ $FAIL_COUNT -lt $MAX_FAILS ]; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "▶ Starting Enhanced 50FPS Engine | Attempt: $((FAIL_COUNT + 1))"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            streamlink \
              --loglevel warning \
              --retry-streams 5 \
              --retry-open 5 \
              --stream-segment-attempts 5 \
              --stream-segment-timeout 10 \
              --http-header "User-Agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
              --http-header "Referer=http://www.manar2.shop/" \
              "hlsvariant://$SOURCE_URL" best \
              -O | ffmpeg \
              -hide_banner \
              -loglevel warning \
              -stats \
              -fflags +genpts+discardcorrupt \
              -f mpegts -i pipe:0 \
              -loop 1 -i "logocopyayhamA.png" \
              -filter_complex \
                "[0:v]fps=50,eq=saturation=1.15:contrast=1.08:brightness=0.02:gamma=1.05,unsharp=3:3:0.5:3:3:0.0[enhanced];
                 [1:v][enhanced]scale2ref[logo][video];
                 [video][logo]overlay=0:0:format=auto,format=yuv420p,setsar=1" \
              -af "volume=1.2,loudnorm=I=-16:TP=-1.5:LRA=11" \
              -c:v libx264 \
              -preset veryfast \
              -tune zerolatency \
              -profile:v high \
              -color_primaries bt709 \
              -color_trc bt709 \
              -colorspace bt709 \
              -crf 20 \
              -b:v 5500k \
              -maxrate 6500k \
              -bufsize 12000k \
              -g 100 \
              -keyint_min 50 \
              -c:a aac \
              -b:a 192k \
              -ar 44100 \
              -ac 2 \
              -max_muxing_queue_size 4096 \
              -f flv \
              "$RTMP_URL"

            EXIT_CODE=$?
            echo "⚠ Pipeline exited with code: $EXIT_CODE"

            FAIL_COUNT=$((FAIL_COUNT + 1))
            WAIT=$((FAIL_COUNT * 3))
            [ $WAIT -gt 30 ] && WAIT=30
            echo "🔄 Reconnecting in ${WAIT}s... (Fail $FAIL_COUNT/$MAX_FAILS)"
            sleep $WAIT
          done

          echo "❌ Max reconnect attempts reached. Exiting."
          exit 1

