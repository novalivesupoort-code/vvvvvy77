name: 1080p@Auto-Engine

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Tools (Fast)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pip
          pip install --quiet streamlink
          ffmpeg -version | head -1
          streamlink --version

      - name: Start Stream
        run: |
          RTMP_URL="rtmp://vsu.okcdn.ru/input/15980421979756_17750707931756_3zvyihuvcy"
          SOURCE_URL="http://g.avivorix.cc/live/atshad/shgowhbs/1339214.ts?"

          if [ ! -f "logocopyayhamA.png" ]; then
            echo "❌ Logo file not found!"
            exit 1
          fi

          FAIL_COUNT=0
          MAX_FAILS=10

          while [ $FAIL_COUNT -lt $MAX_FAILS ]; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "▶ Starting Pure Quality Stream | Attempt: $((FAIL_COUNT + 1))"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            if [[ "$SOURCE_URL" == *".ts"* ]]; then
              echo "💡 Stream Type Detected: Direct TS Stream"
              ffmpeg \
                -hide_banner \
                -loglevel warning \
                -stats \
                -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
                -headers "Referer: http://g.avivorix.cc/" \
                -reconnect 1 \
                -reconnect_at_eof 1 \
                -reconnect_streamed 1 \
                -reconnect_delay_max 5 \
                -fflags +genpts+discardcorrupt \
                -f mpegts -i "$SOURCE_URL" \
                -i "logocopyayhamA.png" \
                -filter_complex "[0:v][1:v]overlay=0:0" \
                -c:v libx264 \
                -preset ultrafast \
                -tune zerolatency \
                -crf 18 \
                -b:v 5500k \
                -maxrate 6000k \
                -bufsize 12000k \
                -pix_fmt yuv420p \
                -c:a aac \
                -b:a 128k \
                -ar 44100 \
                -ac 2 \
                -max_muxing_queue_size 1024 \
                -f flv \
                "$RTMP_URL"
            else
              echo "💡 Stream Type Detected: HLS M3U8 Stream"
              streamlink \
                --loglevel warning \
                --retry-streams 5 \
                --retry-open 5 \
                --stream-segment-attempts 5 \
                --stream-segment-timeout 10 \
                --http-header "User-Agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
                --http-header "Referer=http://www.manar2.shop/" \
                "hlsvariant://$SOURCE_URL" best \
                -O | ffmpeg \
                -hide_banner \
                -loglevel warning \
                -stats \
                -fflags +genpts+discardcorrupt \
                -f mpegts -i pipe:0 \
                -i "logocopyayhamA.png" \
                -filter_complex "[0:v][1:v]overlay=0:0" \
                -c:v libx264 \
                -preset ultrafast \
                -tune zerolatency \
                -crf 18 \
                -b:v 5500k \
                -maxrate 6000k \
                -bufsize 12000k \
                -pix_fmt yuv420p \
                -c:a aac \
                -b:a 128k \
                -ar 44100 \
                -ac 2 \
                -max_muxing_queue_size 1024 \
                -f flv \
                "$RTMP_URL"
            fi

            EXIT_CODE=$?
            echo "⚠ Pipeline exited with code: $EXIT_CODE"

            FAIL_COUNT=$((FAIL_COUNT + 1))
            WAIT=$((FAIL_COUNT * 3))
            [ $WAIT -gt 30 ] && WAIT=30
            echo "🔄 Reconnecting in ${WAIT}s... (Fail $FAIL_COUNT/$MAX_FAILS)"
            sleep $WAIT
          done

          echo "❌ Max reconnect attempts reached. Exiting."
          exit 1
