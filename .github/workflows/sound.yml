name: Stream Source Quality

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "رابط مصدر البث HTTP أو HTTPS"
        required: true
        type: string
      rtmp_url:
        description: "رابط RTMP الكامل مع Stream Key"
        required: true
        type: string

concurrency:
  group: live-stream
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SOURCE_URL: ${{ inputs.source_url }}
      RTMP_URL: ${{ inputs.rtmp_url }}
      LOGO_FILE: logocopyayham.png

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1

      - name: Start stream
        run: |
          [[ ! -f "$LOGO_FILE" ]] && { echo "❌ الشعار غير موجود: $LOGO_FILE"; exit 1; }
          [[ ! "$SOURCE_URL" =~ ^https?:// ]] && { echo "❌ رابط المصدر غير صحيح"; exit 1; }
          [[ ! "$RTMP_URL" =~ ^rtmp(s)?:// ]] && { echo "❌ رابط RTMP غير صحيح"; exit 1; }

          while true; do
            echo "▶ بدء البث..."
            ffmpeg \
              -hide_banner -loglevel warning -stats -nostdin \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 \
              -reconnect_on_network_error 1 -reconnect_delay_max 10 \
              -rw_timeout 30000000 \
              -fflags +discardcorrupt+genpts+igndts \
              -err_detect ignore_err \
              -analyzeduration 10000000 -probesize 20000000 \
              -thread_queue_size 1024 \
              -i "$SOURCE_URL" \
              -loop 1 -framerate 30 -i "$LOGO_FILE" \
              -filter_complex "[1:v]scale=1920:1080:flags=lanczos[logo];[logo][0:v]overlay=0:0:eof_action=repeat:format=auto,format=yuv420p,setsar=1[v]" \
              -map "[v]" -map 0:a? \
              -c:v libx264 -preset veryfast -tune zerolatency -profile:v high \
              -pix_fmt yuv420p -crf 18 -maxrate 6000k -bufsize 12000k \
              -g 60 -keyint_min 30 -sc_threshold 0 \
              -c:a aac -b:a 192k -ar 48000 -ac 2 \
              -af "aresample=async=1:min_hard_comp=0.100:first_pts=0" \
              -max_muxing_queue_size 4096 \
              -flvflags no_duration_filesize \
              -f flv "$RTMP_URL"

            echo "⚠ FFmpeg توقف، إعادة الاتصال بعد 5 ثواني..."
            sleep 5
          done
