name: Stream Source Quality

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "رابط مصدر البث HTTP أو HTTPS"
        required: true
        type: string

      rtmp_url:
        description: "رابط RTMP الكامل مع Stream Key"
        required: true
        type: string

      logo_width:
        description: "حجم الشعار من عرض الفيديو: 0.18 = 18%"
        required: true
        default: "0.18"
        type: string

concurrency:
  group: live-stream
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      SOURCE_URL: ${{ inputs.source_url }}
      RTMP_URL: ${{ inputs.rtmp_url }}
      LOGO_WIDTH: ${{ inputs.logo_width }}
      LOGO_FILE: ayhamm.png

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$LOGO_FILE" ]]; then
            echo "❌ لم يتم العثور على الشعار: $LOGO_FILE"
            echo "ارفع الملف إلى جذر المستودع وبالاسم نفسه."
            exit 1
          fi

          if [[ ! "$SOURCE_URL" =~ ^https?:// ]]; then
            echo "❌ رابط المصدر يجب أن يبدأ بـ http:// أو https://"
            exit 1
          fi

          if [[ ! "$RTMP_URL" =~ ^rtmp(s)?:// ]]; then
            echo "❌ رابط البث يجب أن يبدأ بـ rtmp:// أو rtmps://"
            exit 1
          fi

          if [[ ! "$LOGO_WIDTH" =~ ^0.[0-9]+$ ]]; then
            echo "❌ حجم الشعار يجب أن يكون هكذا: 0.18"
            exit 1
          fi

          echo "✅ الشعار موجود: $LOGO_FILE"
          echo "✅ إعدادات البث صحيحة."

      - name: Start stream
        shell: bash
        run: |
          set -uo pipefail

          MAX_FAILS=100
          FAIL_COUNT=0

          while (( FAIL_COUNT < MAX_FAILS )); do
            ATTEMPT=$((FAIL_COUNT + 1))

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "▶ بدء البث | المحاولة $ATTEMPT من $MAX_FAILS"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            ffmpeg \
              -hide_banner \
              -loglevel warning \
              -stats \
              -nostdin \
              -reconnect 1 \
              -reconnect_at_eof 1 \
              -reconnect_streamed 1 \
              -reconnect_on_network_error 1 \
              -reconnect_delay_max 10 \
              -rw_timeout 30000000 \
              -fflags +discardcorrupt+genpts+igndts \
              -err_detect ignore_err \
              -analyzeduration 10000000 \
              -probesize 20000000 \
              -thread_queue_size 1024 \
              -i "$SOURCE_URL" \
              -loop 1 \
              -framerate 25 \
              -i "$LOGO_FILE" \
              -filter_complex "\
                [1:v][0:v]scale2ref=w=main_w*${LOGO_WIDTH}:h=-1:flags=lanczos[logo][base]; \
                [base][logo]overlay=x=30:y=main_h-overlay_h-30:eof_action=repeat:format=auto, \
                format=yuv420p,setsar=1[v]" \
              -map "[v]" \
              -map 0:a? \
              -c:v libx264 \
              -preset veryfast \
              -tune zerolatency \
              -profile:v high \
              -pix_fmt yuv420p \
              -crf 20 \
              -maxrate 5000k \
              -bufsize 10000k \
              -g 50 \
              -keyint_min 25 \
              -sc_threshold 0 \
              -c:a aac \
              -b:a 160k \
              -ar 44100 \
              -ac 2 \
              -af "aresample=async=1:min_hard_comp=0.100:first_pts=0" \
              -max_muxing_queue_size 4096 \
              -flvflags no_duration_filesize \
              -f flv \
              "$RTMP_URL"

            EXIT_CODE=$?
            echo "⚠ FFmpeg توقف برمز: $EXIT_CODE"

            FAIL_COUNT=$((FAIL_COUNT + 1))
            WAIT=$((FAIL_COUNT * 3))

            if (( WAIT > 30 )); then
              WAIT=30
            fi

            echo "🔄 إعادة الاتصال بعد ${WAIT} ثانية..."
            sleep "$WAIT"
          done

          echo "❌ وصل البث إلى الحد الأقصى من محاولات إعادة الاتصال."
          exit 1
